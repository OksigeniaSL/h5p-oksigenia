name: ci

# Unit tests, language files, build, the example .h5p files and the end-to-end tests in a browser against the
# h5p-cli dev server.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*-v*']

permissions:
  contents: read

jobs:
  test:
    name: Test and pack
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Language files up to date
        run: node tools/language.mjs --check

      - name: Build and pack
        run: npm run pack

      # Release tags are read by machines (installations that follow this repository): <game>-v<version>, matching
      # the game's library.json, with every example package and SHA256SUMS ready to attach.
      - name: Tag matches a game version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME}"
          game="${tag%-v*}"
          version="${tag##*-v}"
          lib="packages/$game/library.json"
          test -f "$lib" || { echo "::error::$tag: no game called $game"; exit 1; }
          actual=$(node -p "const l=require('./$lib'); [l.majorVersion,l.minorVersion,l.patchVersion].join('.')")
          test "$version" = "$actual" || { echo "::error::$tag says $version, $lib says $actual"; exit 1; }
          ls "dist/$game-$version-"*.h5p
          (cd dist && sha256sum "$game-$version-"*.h5p > SHA256SUMS && cat SHA256SUMS)

      - name: Browser
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests
        run: npx playwright test
        env:
          CI: 'true'

      - name: Example packages
        uses: actions/upload-artifact@v4
        with:
          name: h5p-packages
          path: |
            dist/*.h5p
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
