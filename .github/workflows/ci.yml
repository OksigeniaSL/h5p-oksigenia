name: ci

# Unit tests, language files, build, the example .h5p files and the end-to-end tests in a browser against the
# h5p-cli dev server.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*-v*']

permissions:
  contents: read

jobs:
  test:
    name: Test and pack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Types
        run: npm run typecheck

      - name: Language files up to date
        run: node tools/language.mjs --check

      - name: Build and pack
        run: npm run pack

      - name: Browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test
        env:
          CI: 'true'

      - name: Example packages
        uses: actions/upload-artifact@v4
        with:
          name: h5p-packages
          path: dist/*.h5p
          if-no-files-found: error

      - name: Test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
